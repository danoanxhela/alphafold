<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>Modello AlphaFold 3D</title>
  <script src="https://3dmol.org"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #ffffff; }
    #viewer { width: 100%; height: 100vh; position: relative; }
  </style>
</head>
<body>
  <div id="viewer"></div>
  <script>
    let element = document.getElementById('viewer');
    let viewer = $3Dmol.createViewer(element, { backgroundColor: 'white' });

    fetch('./41b221db74753bae.cif')
      .then(response => response.text())
      .then(data => {
        viewer.addModel(data, "cif");
        
        // Colorazione standard AlphaFold pLDDT (salvata nel campo b-factor del file .cif)
        viewer.setStyle({}, {
          cartoon: {
            colorfunc: function(atom) {
              if (atom.b >= 90) return '#0053D6';      // Blu scuro: confidenza molto alta
              if (atom.b >= 70) return '#65CBF3';      // Azzurro: confidenza alta
              if (atom.b >= 50) return '#FFDB13';      // Giallo: confidenza bassa
              return '#FF7D45';                        // Arancione: confidenza molto bassa
            }
          }
        });

        viewer.zoomTo();
        viewer.render();
      })
      .catch(err => {
        element.innerHTML = "<p style='padding:20px; font-family:sans-serif;'>Errore caricamento: " + err + "</p>";
      });
  </script>
</body>
</html>
