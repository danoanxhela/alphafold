<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <title>Modello AlphaFold 3D</title>
  <link rel="stylesheet" type="text/css" href="https://jsdelivr.net" />
  <script type="text/javascript" src="https://jsdelivr.net"></script>
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
    #viewer { position: relative; width: 100%; height: 100vh; }
    #status { position: absolute; top: 15px; left: 15px; z-index: 10; background: #f0f0f0; padding: 8px 12px; border-radius: 4px; font-size: 13px; }
  </style>
</head>
<body>
  <div id="status">Inizializzazione visualizzatore 3D...</div>
  <div id="viewer"></div>

  <script>
    window.onload = function() {
      var statusEl = document.getElementById('status');
      try {
        if (typeof PDBeMolstarPlugin === 'undefined') {
          statusEl.innerText = 'Errore: libreria Molstar non caricata (controlla connessione o blocco Safari).';
          return;
        }
        statusEl.innerText = 'Caricamento modello AlphaFold...';
        var viewerInstance = new PDBeMolstarPlugin();
        var options = {
          customData: {
            url: 'https://githubusercontent.com',
            format: 'cif',
            binary: false
          },
          alphafoldView: true,
          bgColor: { r: 255, g: 255, b: 255 },
          hideControls: false
        };
        viewerInstance.render(document.getElementById('viewer'), options);
        setTimeout(function() { statusEl.style.display = 'none'; }, 3000);
      } catch (e) {
        statusEl.innerText = 'Errore: ' + e.message;
      }
    };
  </script>
</body>
</html>
